<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
/* Layout: barra superior fixa com navegação + conteúdo em grade; gaveta lateral para editar o lead. */
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#16202c; --muted:#5f6b7a; --line:#e2e6eb; --accent:#0f6e66; --accent-soft:#e3f2f0;
  --ok:#1b7f4f; --ok-soft:#e1f3e9; --bad:#b93a2e; --bad-soft:#fbe6e3; --warn:#b26a00; --warn-soft:#fdf0d8; --info:#2459b8; --info-soft:#e4ecfb;
  --grey-soft:#eceff3; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.05);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --card:#171e26; --ink:#e7ecf1; --muted:#97a3b1; --line:#27313c; --accent:#3cbcae; --accent-soft:#163a37;
  --ok:#4cc38a; --ok-soft:#173a29; --bad:#f07a6d; --bad-soft:#3e1f1c; --warn:#f0b04a; --warn-soft:#3b2d14; --info:#7aa7f5; --info-soft:#1b2a45;
  --grey-soft:#222b35; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141a; --card:#171e26; --ink:#e7ecf1; --muted:#97a3b1; --line:#27313c; --accent:#3cbcae; --accent-soft:#163a37;
  --ok:#4cc38a; --ok-soft:#173a29; --bad:#f07a6d; --bad-soft:#3e1f1c; --warn:#f0b04a; --warn-soft:#3b2d14; --info:#7aa7f5; --info-soft:#1b2a45;
  --grey-soft:#222b35; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topin{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:8px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}

.who{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;text-wrap:balance}

textarea{min-height:70px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:36px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip .c{font-family:var(--f-num);font-size:11px;opacity:.8}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-contato{background:var(--grey-soft);color:var(--muted)}
.p-agendado{background:var(--info-soft);color:var(--info)}
.p-presenca{background:var(--ok-soft);color:var(--ok)}

.alert{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.muted{color:var(--muted)}
.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--k,var(--accent));box-shadow:var(--shadow)}
.kpi>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}

.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi .d-up{color:var(--ok);font-weight:700} .kpi .d-dn{color:var(--bad);font-weight:700}
.funnel{display:flex;flex-direction:column;gap:8px}
.fbar{display:grid;grid-template-columns:140px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.fbar .t{height:26px;background:var(--grey-soft);border-radius:6px;overflow:hidden}
.fbar .t i{display:block;height:100%;background:var(--accent);border-radius:6px}
.fbar .v{font-family:var(--f-num);text-align:right}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.chart .grid{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:41;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer header h3{margin:0;font-size:17px}
.drawer .body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.drawer footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;font-weight:600;cursor:pointer;font-size:13px}
.stepper button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:10px}
.timeline div{position:relative;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.newlead{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.empty{padding:28px;text-align:center;color:var(--muted)}
.lock{display:grid;place-items:center;min-height:300px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
input.money{width:120px;text-align:right;font-family:var(--f-num)}
.pos{color:var(--ok);font-weight:700} .neg{color:var(--bad);font-weight:700}
tr.risc td{text-decoration:line-through;color:var(--muted)} tr.risc td:first-child{text-decoration:none}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);text-decoration:none;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.info{background:var(--info-soft);color:var(--info)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.conf{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.conf b{font-family:var(--f-num);font-size:15px}.conf2{background:var(--bg);border:1px solid var(--line);margin-top:-6px}
.conf-t{font-weight:700;color:var(--accent);margin-right:4px}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px}
.blk h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.blk h2 .tag{font-size:12px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mini div{background:var(--bg);border-radius:10px;padding:10px 12px}
.mini span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mini b{display:block;font-family:var(--f-num);font-size:22px;font-weight:700;margin-top:2px}
.mini em{font-style:normal;font-size:11.5px;color:var(--muted)}
.best{display:flex;gap:14px;align-items:center;background:var(--ok-soft);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.best b{font-size:20px}
.bar-h{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bar-h .t{height:18px;background:var(--grey-soft);border-radius:4px;overflow:hidden}.bar-h .t i{display:block;height:100%;background:var(--info);border-radius:4px}
.bar-h.top .t i{background:var(--ok)} .bar-h.top{font-weight:700}
.bar-h .v{font-family:var(--f-num);text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600}
@media (max-width:640px){.form2{grid-template-columns:1fr}.fbar{grid-template-columns:100px 1fr 80px}.who span.nm{display:none}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
.bar-h.rk{grid-template-columns:150px 1fr 96px}.rk2{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:760px){.rk2{grid-template-columns:1fr}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.subtab{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.subtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.subtab:hover{border-color:var(--accent)}
tr.dup td{background:var(--bad-soft)!important}tr.dup td:first-child{box-shadow:inset 4px 0 0 var(--bad)}.tag.dupt{background:var(--bad);color:#fff;font-weight:700;white-space:nowrap}
tr.dup2 td{background:var(--warn-soft)!important}tr.dup2 td:first-child{box-shadow:inset 4px 0 0 var(--warn)}.tag.dupt2{background:var(--warn);color:#fff;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><b>Funil de Leads</b><span>Comunicação · Marketing 2026</span></div>
  <nav class="tabs" id="tabs">
    <a href="#inicio" data-v="inicio">Início</a>
    <a href="#lancamentos" data-v="lancamentos">Lançamentos</a>
    <a href="#funil" data-v="funil" id="tab-funil" hidden>Funil</a>
    <a href="#administrativo" data-v="administrativo" id="tab-adm" hidden>Administrativo</a>
  </nav>
  <div class="who" id="who"><span class="nm">Conectando…</span></div>
</div></header>
<main id="main"><div class="card empty">Carregando dados…</div></main>
<div id="drawer-root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="shim.js"></script>
<script>
"use strict";
/* ---------------- constantes ---------------- */
const OPC = {
  canal:["Principal","Paralela","Site","Empresas","Google","YouTube","TikTok","Pinterest","Instagram","Facebook","WhatsApp (anúncios)","Orgânico","Indicação","Disparo","Outros"],
  cidade:["Caxias","Farroupilha","Flores da Cunha","Bento Gonçalves","Veranópolis","Encantado","Soledade","Fora da área","Outra cidade"],
  interesse:["Aparelho","Implante","Facetas","Clínico geral"],
  situacao:["Em contato","Agendado","Presença","Faltoso","Cancelado","Perdeu interesse"],
  status:["Presença","Faltoso","Cancelado"]
};
const MIDIA=new Set(["Principal","Paralela","Site","Empresas","Google","YouTube","TikTok","Pinterest","Instagram","Facebook","WhatsApp (anúncios)"]);
const MIDIA_FONTE=/an[uú]ncio|site|empresa|google|youtube|tiktok|pinterest|insta|facebook|whats/i;
const isMidia=l=>MIDIA.has(l.canal)||(l.canal==="Outros"&&MIDIA_FONTE.test(l.fonte||""));
const META={presenca:5,limpeza:5,proc:1,juli:2,limpezaMin:219};
const tel8=s=>{const d=String(s||"").replace(/\D/g,"");return d.length>=8?d.slice(-8):""};
const EQUIPE=["Vinícius","Samara","Bernardo"];const MKT="Juliana";
const semAc=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const MES_NOME=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const ULTIMO_ARQUIVADO="2026-10";      // meses até aqui vêm do histórico (somente leitura)
const PRIMEIRO_MES="2026-01";
const hoje=new Date().toLocaleDateString("sv-SE");
const mesAtual=hoje.slice(0,7);
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const BRL0=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const NUM=new Intl.NumberFormat("pt-BR");
const pct=x=>isFinite(x)?(x*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%":"–";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtData=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"";
const nomeMes=k=>MES_NOME[+k.slice(5,7)-1]+" "+k.slice(0,4);
const fimMes=k=>{const [y,m]=k.split("-").map(Number);return k+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0")};
function listaMeses(){const out=[];let [y,m]=PRIMEIRO_MES.split("-").map(Number);const max=mesAtual>"2026-12"?mesAtual:"2026-12";
  while(true){const k=y+"-"+String(m).padStart(2,"0");out.push(k);if(k>=max)break;m++;if(m>12){m=1;y++}}return out}
const MESES=listaMeses();
const isLive=k=>k>ULTIMO_ARQUIVADO;
const trimestre=k=>Math.ceil(+k.slice(5,7)/3);
const sitClass=s=>({"Em contato":"p-contato","Agendado":"p-agendado","Presença":"p-presenca","Faltoso":"p-faltoso","Cancelado":"p-cancelado","Perdeu interesse":"p-perdeu"}[s]||"p-contato");

/* ---------------- estado ---------------- */
const S={resp:{},view:"inicio",mes:MESES.includes(mesAtual)?mesAtual:MESES[MESES.length-1],hist:null,live:{},liveReady:{},adm:{},admReady:false,
  db:null,user:null,me:null,isOwner:false,canWrite:null,readOnlyForced:false,names:{},
  f:{sit:"",cidade:"",canal:"",interesse:"",resp:"",busca:"",pend:false,lim:150,st:"",eDe:"",eAte:"",cDe:"",cAte:""},
  ff:{cidade:"",canal:"",interesse:"",resp:""}, adm_mode:"mes", adm_tri:Math.ceil((+mesAtual.slice(5,7))/3), adm_soSemValor:false,
  stale:false, err:"", migr:null, risc:{}, solic:[], cfg:{gestores:[]}, isAdm:false, novoTel:"", pessoas:null, pub:{}, fin_mode:"mes"};

/* ---------------- dados ---------------- */
function fromHist(mes,arr,i){return {key:"h-"+mes+"-"+i,mes,live:false,canal:arr[0],data:arr[1],contato:arr[2],cidade:arr[3],interesse:arr[4],
  situacao:arr[5],status:arr[6],cod:"",obs:arr[7],agendamento:arr[8],fechou:arr[9],fonte:arr[10],resp:null,notas:[]}}
function fromDoc(mes,d){const x=d.data()||{};return {key:d.id,id:d.id,mes,live:true,canal:x.canal||"",data:x.data||"",contato:x.contato||"",cidade:x.cidade||"",
  interesse:x.interesse||"",situacao:x.situacao||"",status:x.status||"",cod:x.cod||"",obs:x.obs||"",agendamento:x.agendamento||"",
  fechou:x.fechou||"",fonte:x.fonte||"",resp:x.resp||null,criado:x.criado||"",notas:Array.isArray(x.notas)?x.notas:[],riscado:x.riscado||null,anteriores:x.anteriores||[],agPor:x.agPor||""}}
function leadsDo(mes){
  if(!isLive(mes)){const h=S.hist&&S.hist.meses[mes];return h?(h._c||(h._c=h.map((a,i)=>fromHist(mes,a,i)))):[]}
  return S.live[mes]||[];
}
const R={
  pres:l=>l.status==="Presença"||(!l.status&&l.situacao==="Presença"),
  falt:l=>l.status==="Faltoso"||(!l.status&&l.situacao==="Faltoso"),
  canc:l=>l.status==="Cancelado"||(!l.status&&l.situacao==="Cancelado"),
  agend:l=>!!l.agendamento,
  aguard:l=>l.situacao==="Agendado"&&!l.status,
  emc:l=>l.situacao==="Em contato",
  perd:l=>l.situacao==="Perdeu interesse",
  fech:l=>l.fechou==="Sim",
};
function met(ls,mes){const fim=fimMes(mes),ini=mes+"-01";const m={leads:ls.length,agend:0,ag_mes:0,ag_seg:0,pres:0,falt:0,canc:0,emc:0,perd:0,aguard:0,fech:0};
  for(const l of ls){if(R.agend(l)){m.agend++;if(l.agendamento>=ini&&l.agendamento<=fim)m.ag_mes++;else if(l.agendamento>fim)m.ag_seg++}
    if(R.pres(l))m.pres++;if(R.falt(l))m.falt++;if(R.canc(l))m.canc++;if(R.emc(l))m.emc++;if(R.perd(l))m.perd++;if(R.aguard(l))m.aguard++;if(R.fech(l))m.fech++}
  m.convAg=m.agend/m.leads;m.comp=m.pres/(m.pres+m.falt);m.convPres=m.pres/m.leads;return m}

function dupsDe(ls){const set=new Set(),orig={},visto={},prim=new Set();

async function salvarLead(){const l=acharLead(S.sel.key);if(!l||!l.live)return;const d=S.sel.draft;
  if(d.situacao==="Agendado"&&!d.agendamento){toast("Preencha a data da consulta.");return}

  const mud={};for(const c of campos)if((d[c]||"")!==(l[c]||""))mud[c]=d[c]||"";
  const nota=(d.nota||"").trim();
  if(!Object.keys(mud).length&&!nota){S.sel=null;render();return}
  const n={u:S.me||"",t:new Date().toISOString(),de:l.situacao||"",para:d.situacao||"",st:mud.status!==undefined?mud.status:"",txt:nota};
  const corpo={...mud,notas:[...l.notas,n].slice(-60),atualizado:n.t,atualizadoPor:S.me||""};
  const btn=document.getElementById("d-save");if(btn)btn.disabled=true;
  try{await serial(l.key,()=>S.db.doc("m/"+l.mes+"/leads/"+l.id).update(corpo));toast("Salvo no funil.");S.sel=null;render()}
  catch(e){if(btn)btn.disabled=false;tratarErro(e)}}
function tratarErro(e){const c=e&&e.code;
  if(c==="invalid_argument"&&S.canWrite==null){S.readOnlyForced=true;toast("Seu acesso não permite editar.");render()}
  else if(c==="quota_exceeded")toast("O banco de dados atingiu o limite. Avise a administradora.");
  else if(c==="resource_exhausted")toast("Muitas gravações seguidas. Espere alguns segundos e tente de novo.");
  else toast("Não consegui salvar ("+(c||"erro")+"). Tente de novo.")}

/* ---------------- gráficos SVG ---------------- */
function escala(max){if(max<=0)return [1,[0,1]];const p=Math.pow(10,Math.floor(Math.log10(max)));let st=[1,2,2.5,5,10].map(x=>x*p).find(s=>max/s<=5);const top=Math.ceil(max/st)*st;const ticks=[];for(let v=0;v<=top+1e-9;v+=st)ticks.push(v);return [top,ticks]}
function barras(dados,cores,nomes,o){o=o||{};const W=Math.max(560,dados.length*(o.bw||26)),H=o.h||220,pl=o.money?70:40,pb=26,pt=10,pr=10;
  const max=Math.max(0,...dados.flatMap(d=>d.v));const [top,ticks]=escala(max);const gw=(W-pl-pr)/dados.length,n=cores.length,bw=Math.min(22,(gw*0.78)/n);
  const y=v=>pt+(H-pt-pb)*(1-v/top);const fmt=o.money?(v=>BRL0.format(v)):(v=>NUM.format(v));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(nomes.join(", "))}">`;
  for(const t of ticks)s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`;
  dados.forEach((d,i)=>{const x0=pl+gw*i+(gw-bw*n)/2;d.v.forEach((v,j)=>{if(v>0)s+=`<rect x="${x0+j*bw}" y="${y(v)}" width="${bw-2}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${cores[j]}"><title>${esc(d.label)} · ${esc(nomes[j])}: ${fmt(v)}</title></rect>`});
    s+=`<text x="${pl+gw*i+gw/2}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`});
  s+=`</svg>`;return `<div style="overflow-x:auto">${s}</div><div class="legend">${nomes.map((nm,j)=>`<span><i style="background:${cores[j]}"></i>${esc(nm)}</span>`).join("")}</div>`}

/* ---- Responsáveis pelos agendamentos: importar da planilha de metas do comercial ---- */
const ABAS_RESP=[[/^VINI(CIUS)?$/,"Vinícius"],[/^SAMI|^SAMARA$/,"Samara"],[/^BER(NARDO)?$/,"Bernardo"]];
function abaParaNome(t){const n=semAc(String(t||"")).toUpperCase().trim();for(const [re,nome] of ABAS_RESP)if(re.test(n))return nome;return null}
function mesDoArquivo(nome){const n=semAc(nome).toLowerCase();for(let i=0;i<12;i++)if(n.includes(semAc(MES_NOME[i]).toLowerCase())){const k="2026-"+String(i+1).padStart(2,"0");if(MESES.includes(k))return k}
  const m=n.match(/^(\d{1,2})[.\s_-]/);if(m){const k="2026-"+String(+m[1]).padStart(2,"0");if(MESES.includes(k))return k}return null}
const codsDe=x=>new Set((String(x||"").match(/(?<!\d)\d{2,7}(?!\d)/g)||[]).map(c=>c.replace(/^0+/,"")).filter(Boolean));
// COD do lead: no histórico ele fica no começo da observação ("13197 | nome"); datas e outros números da observação não contam
const codsLead=l=>new Set([...codsDe(l.live?l.cod:String(l.obs||"").split(/[|·]/)[0])].filter(c=>c.length>=3));

// datas da planilha de metas: texto dd/mm/aaaa; células de data vieram com dia e mês trocados (Excel em inglês)
function dataPlan(x){const p2=n=>String(n).padStart(2,"0");
  if(typeof x==="number"&&x>20000&&x<80000){const d=XLSX.SSF.parse_date_code(x);if(!d)return "";return d.d<=12?`${d.y}-${p2(d.d)}-${p2(d.m)}`:`${d.y}-${p2(d.m)}-${p2(d.d)}`}
  const m=String(x||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${p2(m[2])}-${p2(m[1])}`:""}
const CANAL_PLAN=v=>{const n=semAc(v).toLowerCase();if(!n)return "Orgânico";if(n.startsWith("organ")||n.includes("profilaxia/org"))return "Orgânico";
  if(n.includes("bot")||n.includes("site"))return "Site";for(const c of OPC.canal)if(semAc(c).toLowerCase()===n)return c;return "Outros"};
const CIDADE_PLAN=v=>{const n=semAc(v).toLowerCase();if(!n)return "";for(const c of OPC.cidade)if(semAc(c).toLowerCase().startsWith(n)||n.startsWith(semAc(c).toLowerCase()))return c;return "Outra cidade"};
const INTER_PLAN=v=>{const n=semAc(v).toLowerCase();return n.startsWith("orto")?"Aparelho":n.startsWith("impl")?"Implante":n.startsWith("facet")?"Facetas":"Clínico geral"};
function leadDaPlanilha(x,mes){const st=["Presença","Faltoso","Cancelado"].find(s=>semAc(s).toLowerCase()===semAc(x.status).toLowerCase())||"";
  const sn=semAc(x.sit).toLowerCase();const sit=sn.startsWith("perdeu")?"Perdeu interesse":sn.startsWith("em contato")?"Em contato":"Agendado";
  const dentro=x.data&&x.data.slice(0,7)===mes;const data=dentro?x.data:(mes+"-01");
  const obs=["Importado da planilha de metas ("+x.aba+")",x.via&&CANAL_PLAN(x.via)!==x.via?"via "+x.via:"",x.esp?"especialidade "+x.esp:"",!dentro&&x.data?"entrada original "+fmtData(x.data):""].filter(Boolean).join(" · ");
  return {canal:CANAL_PLAN(x.via),data,contato:x.telBruto,cidade:CIDADE_PLAN(x.cidade),interesse:INTER_PLAN(x.esp),situacao:sit,status:sit==="Agendado"?st:"",
    cod:x.cod,obs,agendamento:x.ag&&x.ag.slice(0,4)==="2026"?x.ag:"",fechou:"",fonte:x.via||"",agPor:x.nome}}
function lerAbasMetas(wb){const out=[];
  for(const t of wb.SheetNames){const nome=abaParaNome(t);if(!nome)continue;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[t],{header:1,raw:true,defval:""});
    let hi=rows.findIndex(r=>r.some(c=>semAc(String(c)).toLowerCase().trim()==="telefone")&&r.some(c=>String(c).trim().toUpperCase()==="COD"));if(hi<0)continue;
    const H=rows[hi].map(c=>semAc(String(c)).toLowerCase().trim());const ix=n=>H.indexOf(n);const iT=ix("telefone"),iC=ix("cod"),iQ=ix("quem agendou");
    const iV=ix("via"),iD=ix("data"),iCi=ix("cidade"),iSi=ix("situacao"),iA=ix("agendamento"),iS=ix("status"),iE=ix("especialidade");
    const v=(r,i)=>i>=0?String(r[i]??"").replace(/\s+/g," ").trim():"";
    for(const r of rows.slice(hi+1)){const telBruto=String(r[iT]??"").replace(/\.0+$/,"").trim();const tel=tel8(telBruto);const cv=r[iC];const cod=cv===""||cv==null?"":String(typeof cv==="number"?Math.trunc(cv):cv).trim();
      if(!tel&&!cod)continue;out.push({aba:t,nome,tel,telBruto,cod,cods:new Set([...codsDe(cod)].filter(c=>c.length>=3)),quem:iQ>=0?String(r[iQ]||"").trim():"",
        via:v(r,iV),data:dataPlan(r[iD]),cidade:v(r,iCi),sit:v(r,iSi),ag:dataPlan(r[iA]),status:v(r,iS),esp:v(r,iE)})}}
  return out}
function cruzarResp(linhas,mes){const idxT={},idxC={};
  for(const k of MESES)for(const l of ativos(k)){const t=tel8(l.contato);if(t)(idxT[t]=idxT[t]||[]).push(l);
    for(const c of codsLead(l))(idxC[c]=idxC[c]||[]).push(l)}
  const atrib={},porPessoa={},conflito=new Set(),novos=[];let thaina=0;
  for(const x of linhas){const pp=porPessoa[x.nome]=porPessoa[x.nome]||{linhas:0,achou:0,sem:0};pp.linhas++;if(/thain/i.test(semAc(x.quem)))thaina++;
    const c=new Map();for(const l of (x.tel&&idxT[x.tel])||[])c.set(l.key,l);for(const cd of x.cods)for(const l of idxC[cd]||[])c.set(l.key,l);
    let alvo=[...c.values()].filter(l=>(l.agendamento||"").slice(0,7)===mes);if(!alvo.length)alvo=[...c.values()].filter(l=>l.mes===mes);
    if(!alvo.length){pp.sem++;novos.push(x);continue}pp.achou++;
    const stP=["Presença","Faltoso","Cancelado"].find(s=>semAc(s).toLowerCase()===semAc(x.status).toLowerCase())||"";
    const snP=semAc(x.sit).toLowerCase();const agendouP=!snP.startsWith("perdeu")&&!snP.startsWith("em contato");
    for(const l of alvo){const a=atrib[l.key];if(a&&a.nome!==x.nome)conflito.add(l.key);
      else atrib[l.key]={l,nome:x.nome,st:(a&&a.st)||stP,agendar:(a&&a.agendar)||(agendouP&&!noGrupoAg(l)&&!R.agend(l)?{ag:x.ag&&x.ag.slice(0,4)==="2026"?x.ag:""}:null)}}}
  for(const k of conflito)delete atrib[k];
  const lista=Object.values(atrib);const mudam=lista.filter(a=>agendadorNome(a.l)!==a.nome).length;
  const statusNovos=lista.filter(a=>a.st&&!a.l.status&&!["Presença","Faltoso","Cancelado"].includes(a.l.situacao)).length;
  // mesmo paciente repetido entre as abas: cria um só (fica com a 1ª aba)
  const vistos=new Set(),novosU=[];for(const x of novos){const ks=[x.tel&&"t"+x.tel,...[...x.cods].map(c=>"c"+c)].filter(Boolean);if(!ks.length||ks.some(k=>vistos.has(k)))continue;ks.forEach(k=>vistos.add(k));novosU.push(x)}
  const porCanal={};for(const x of novosU){const c=CANAL_PLAN(x.via);porCanal[c]=(porCanal[c]||0)+1}
  const agendar=lista.filter(a=>a.agendar).length;
  return {mes,porPessoa,lista,conflitos:conflito.size,thaina,mudam,novos:novosU,porCanal,statusNovos,agendar}}
async function importarResp(file){if(!S.isAdm)return;const mes=S.respMes||mesDoArquivo(file.name)||S.mes;S.respMes=mes;

  catch(e){toast("Não consegui ler a planilha. Confira se é um arquivo .xlsx.")}}

        if(S.isOwner&&(a.agendar||semSt(a))){(histSt[a.l.mes]=histSt[a.l.mes]||{})[ix]={st:a.st,agendar:a.agendar};nSt++}}}
    for(const [m,st] of Object.entries(histSt)){const arr=S.hist.meses[m].map(x=>x.slice(0,11));

/* ---- corrigir duplicidades criadas pela importação da planilha de metas ---- */
const ehImportado=l=>!!(l.importadoMetas||/Importado da planilha de metas/.test(l.obs||""));
function planoLimpeza(mes){const ls=ativos(mes);const d=dupsDe(ls);const grupos={};
  for(const k of d.set){const r=d.orig[k];(grupos[r.key]=grupos[r.key]||[r]).push(ls.find(x=>x.key===k))}
  const acoes=[];
  for(const g of Object.values(grupos)){const orig=g.filter(l=>!ehImportado(l));const fica=orig[0]||g[0];
    const sai=g.filter(l=>l!==fica&&ehImportado(l));if(sai.length)acoes.push({fica,sai})}
  return acoes}
async function limparDupImport(mes){if(!S.isAdm)return;const acoes=planoLimpeza(mes);if(!acoes.length)return;
  if(!isLive(mes)&&!S.isOwner){toast("Só a Nicele pode corrigir meses antigos.");return}
  const b=document.querySelector('[data-a="limpadup"]');if(b)b.disabled=true;
  const t=new Date().toISOString();let n=0;const riscH={},mapa={...((S.resp&&S.resp[mes])||{})};let mudouMapa=false;const histPatch={};
  try{for(const {fica,sai} of acoes){
      // o que fica herda responsável, agendamento e status do importado, se não tiver
      const ref=sai.find(l=>agendadorNome(l))||sai[0];const nomeR=agendadorNome(ref);
      const patch={};if(nomeR&&!agendadorNome(fica))patch.agPor=nomeR;
      if(!noGrupoAg(fica)&&!R.agend(fica)&&(noGrupoAg(ref)||R.agend(ref))){patch.situacao="Agendado";if(ref.agendamento)patch.agendamento=ref.agendamento}
      if(!fica.status&&ref.status)patch.status=ref.status;
      if(Object.keys(patch).length){
        if(fica.live)await serial(fica.key,()=>S.db.doc("m/"+fica.mes+"/leads/"+fica.id).update({...patch,notas:[...fica.notas,{u:"import",t,de:fica.situacao||"",para:patch.situacao||fica.situacao||"",st:patch.status||"",txt:"Dados do lançamento duplicado da importação"}].slice(-60)}));
        else{if(patch.agPor){mapa[fica.key]=patch.agPor;mudouMapa=true}histPatch[+fica.key.split("-").pop()]=patch}}
      for(const l of sai){const info={para:mes,id:fica.id||"",em:t,por:S.me||"",motivo:"Duplicado da importação da planilha de metas"};
        if(l.live)await serial(l.key,()=>S.db.doc("m/"+l.mes+"/leads/"+l.id).update({riscado:info,notas:[...l.notas,{u:S.me||"",t,de:l.situacao||"",para:l.situacao||"",st:"",txt:"Riscado: duplicado da importação da planilha de metas"}].slice(-60)}));
        else riscH[l.key]=info;n++}}
    if(Object.keys(riscH).length)await serial("risc/"+mes,()=>S.db.doc("risc/"+mes).set({itens:{...(S.risc[mes]||{}),...riscH}}));
    if(Object.keys(histPatch).length){const arr=S.hist.meses[mes].map(x=>x.slice(0,11));for(const [i,p] of Object.entries(histPatch)){const r=arr[i];if(!r)continue;if(p.situacao)r[5]=p.situacao;if(p.agendamento&&!r[8])r[8]=p.agendamento;if(p.status&&!r[6])r[6]=p.status}
      await S.db.doc("hist/"+mes).set({json:JSON.stringify(arr)});S.hist.meses[mes]=arr}
    if(mudouMapa){await S.db.doc("resp/"+mes).set({mapa,em:t,por:S.me||""});S.resp[mes]=mapa}
    toast(`${NUM.format(n)} lançamentos duplicados da importação foram riscados em ${nomeMes(mes)}.`);render()}
  catch(e){tratarErro(e);if(b)b.disabled=false}}

function resumoMes(mes){const ls=ativos(mes),m=met(ls,mes),f=finMes(mes);const P=x=>isFinite(x)?(x*100).toFixed(1).replace(".",",")+"%":"–";const B=v=>BRL.format(v);

  if(p==="hoje")return [hoje,hoje,"hoje ("+fmtData(hoje)+")"];
  if(p==="semana"){const w=(new Date(hoje+"T12:00").getDay()+6)%7;const a=somaDias(hoje,-w);return [a,hoje,fmtData(a)+" a "+fmtData(hoje)]}
  if(p==="custom"){let a=f.de||K+"-01",b=f.ate||fimMes(K);if(a>b)[a,b]=[b,a];return [a,b,fmtData(a)+" a "+fmtData(b)]}
  return [K+"-01",fimMes(K),nomeMes(K)]}

   <label class="f" for="mf-col">Colaborador<select id="mf-col" data-a="mfcol">${o("","Todos",col)}${nomes.map(n=>o(n,n,col)).join("")}${o("Juliana","Juliana (mídias)",col)}${o("Sem responsável","Sem responsável",col)}</select></label>
   <label class="f" for="mf-p">Período<select id="mf-p" data-a="mfp">${o("mes","Mês selecionado ("+nomeMes(K)+")",p)}${o("semana","Esta semana",p)}${o("hoje","Hoje",p)}${o("custom","Escolher datas…",p)}</select></label>
   ${p==="custom"?`<label class="f" for="mf-de">De<input type="date" id="mf-de" data-a="mfde" value="${esc(ini)}"></label><label class="f" for="mf-ate">Até<input type="date" id="mf-ate" data-a="mfate" value="${esc(fim)}"></label>`:""}
   ${col||p!=="mes"?`<button class="btn" data-a="mflimpar">Limpar filtro</button>`:""}</div>`;
  if(col){const t=cs.reduce((a,[,c])=>({pres:a.pres+1,limp:a.limp+(c.limp?1:0),proc:a.proc+c.proc,total:a.total+c.total,verif:a.verif+(c.verificar?1:0)}),{pres:0,limp:0,proc:0,total:0,verif:0});
    h+=col==="Juliana"
      ?`<div class="kpis" style="margin-top:14px">${kpi("Presenças de mídia",NUM.format(t.pres),esc(rot),"var(--accent)")}${kpi("Meta da Juliana",reais(t.pres*META.juli),"R$ "+META.juli+" × presenças","var(--ok)")}</div>`
      :`<div class="kpis" style="margin-top:14px">${kpi("Presenças",NUM.format(t.pres),reais(t.pres*META.presenca),"var(--info)")}${kpi("Limpezas",NUM.format(t.limp),reais(t.limp*META.limpeza)+(t.verif?" · "+t.verif+" a verificar":""),"var(--accent)")}${kpi("Proced. pagos",NUM.format(t.proc),reais(t.proc*META.proc),"var(--muted)")}${kpi("Meta de "+col,reais(t.total),esc(rot),"var(--ok)")}</div>`}
  return h+`<div class="small muted" style="margin-top:10px">As presenças contam pela data da consulta. O valor de cada paciente e a limpeza continuam sendo lançados na tabela de conferência abaixo.</div></div>`}

  const psAll=presencasPeriodo(ini,fim).sort((a,b)=>(a.agendamento||"").localeCompare(b.agendamento||""));const csAll=psAll.map(l=>[l,calcMeta(l)]);
  // mesmo paciente (telefone ou COD) com mais de uma presença no período: conta uma vez só
  marcarRepetidos(csAll);
  const cs=col==="Juliana"?csAll.filter(([,c])=>c.midia):col==="Sem responsável"?csAll.filter(([,c])=>!c.ag):col?csAll.filter(([,c])=>c.ag===col):csAll;const ps=cs.map(([l])=>l);const csAll0=csAll;const nDup=cs.filter(([,c])=>c.dup).length;const contam=cs.filter(([,c])=>!c.dup);
  const por={};for(const [l,c] of contam){const k=c.ag||"__sem";(por[k]=por[k]||{pres:0,limp:0,proc:0,total:0,verif:0});por[k].pres++;if(c.limp)por[k].limp++;por[k].proc+=c.proc;por[k].total+=c.total;if(c.verificar)por[k].verif++}
  const verif=contam.filter(([,c])=>c.verificar).length;
  const tot=Object.values(por).reduce((a,b)=>({pres:a.pres+b.pres,limp:a.limp+b.limp,proc:a.proc+b.proc,total:a.total+b.total}),{pres:0,limp:0,proc:0,total:0});
  const linhas=Object.entries(por).sort((a,b)=>b[1].total-a[1].total).map(([id,v])=>[id==="__sem"?'<span class="muted">Sem responsável</span>':esc(id),NUM.format(v.pres),reais(v.pres*META.presenca),NUM.format(v.limp),reais(v.limp*META.limpeza),NUM.format(v.proc),reais(v.proc*META.proc),`<b>${reais(v.total)}</b>`,v.verif?`<span class="tag">${v.verif} a verificar</span>`:""]);
  const juli=contam.filter(([,c])=>c.midia);const porCanal={};for(const [l] of juli){const k=l.canal==="Outros"&&l.fonte?l.fonte:l.canal;porCanal[k]=(porCanal[k]||0)+1}
  let h=vFiltroMetas(K,ini,fim,rot,col,contam);
  if(nDup)h+=`<div class="banner warn">${NUM.format(nDup)} presença${nDup>1?"s":""} de paciente repetido (mesmo telefone ou COD) no período ${nDup>1?"não contam":"não conta"} na meta. Na tabela de conferência ${nDup>1?"elas aparecem":"ela aparece"} com a etiqueta <b>repetido</b>.</div>`;
  if(col!=="Juliana")h+=`<div class="card"><h2>Metas da equipe de comunicação · presenças com consulta em ${esc(rot)}${col?" · "+esc(col):""} <small>R$ ${META.presenca} por presença · + R$ ${META.limpeza} por limpeza confirmada · R$ ${META.proc} por procedimento pago no mês</small></h2>
   ${verif?`<div class="banner warn" style="margin-bottom:12px"><b>Lembrete:</b> ${verif} presença${verif>1?"s":""} com valor a partir de ${reais(META.limpezaMin)}: verifique se foi limpeza e marque Sim ou Não na tabela abaixo.</div>`:""}
   ${linhas.length?tabela(["Colaborador (quem agendou)","Presenças","R$ presenças","Limpezas","R$ limpezas","Proced. pagos","R$ proced.","Total da meta",""],linhas,["TOTAL",NUM.format(tot.pres),reais(tot.pres*META.presenca),NUM.format(tot.limp),reais(tot.limp*META.limpeza),NUM.format(tot.proc),reais(tot.proc*META.proc),`<b>${reais(tot.total)}</b>`,""]):`<div class="empty">Nenhuma presença com consulta em ${esc(rot)}${col?" para "+esc(col):""}.</div>`}
   ${linhas.length?`<div class="row" style="margin-top:10px"><button class="btn" data-a="copiarmetas">Copiar relatório de metas</button><span class="small muted">Cole no Excel, Sheets ou WhatsApp.</span></div>`:""}
  </div>`;
  if(!col||col==="Juliana")h+=`<div class="card" style="border-left:4px solid var(--accent)"><h2>Meta da Juliana · marketing <small>R$ ${META.juli} por presença vinda das mídias (Principal, Paralela, Site, Empresas, Google, YouTube, TikTok, Pinterest, Instagram, Facebook, WhatsApp dos anúncios e Anúncio Juli)</small></h2>
   <div class="kpis">${kpi("Presenças de mídia",NUM.format(juli.length),"de "+NUM.format(csAll.filter(([,c])=>!c.dup).length)+" presenças no período","var(--accent)")}${kpi("Meta da Juliana",reais(juli.length*META.juli),"R$ "+META.juli+" × presenças","var(--ok)")}</div>
   ${juli.length?`<div class="small muted" style="margin-top:10px">Por origem: ${Object.entries(porCanal).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+" "+v).join(" · ")}</div>`:""}</div>`;
  if(ps.length){h+=`<div class="card"><h2>Conferência das presenças · ${esc(rot)}${col?" · "+esc(col):""} <small>${ps.length} presenças · valor, limpeza e procedimentos são lançados aqui pelo gestor</small></h2>
   <div class="row" style="margin-bottom:10px"><button class="chip" data-a="soverif" aria-pressed="${!!S.soVerif}">Só limpezas a verificar</button></div>
   <div class="tablewrap"><table><thead><tr><th>Consulta</th><th>Contato</th><th>COD / Obs.</th><th>Cidade</th><th>Interesse</th><th>Origem</th><th>Agendou</th><th class="n">Valor (R$)</th><th>Limpeza?</th><th class="n">Proced. pagos</th><th class="n">Meta</th></tr></thead><tbody>
   ${cs.filter(([,c])=>!S.soVerif||c.verificar).map(([l,c])=>`<tr><td class="n">${esc(fmtData(l.agendamento||l.data).slice(0,5))}</td><td class="num">${esc(l.contato)}</td><td class="small" style="max-width:200px">${esc([l.cod,l.obs].filter(Boolean).join(" · "))}</td><td>${esc(l.cidade)}</td><td>${esc(l.interesse)}</td>
     <td class="small">${esc(l.canal==="Outros"&&l.fonte?l.fonte:l.canal)}${c.midia?' <span class="tag ok">mídia</span>':""}</td><td class="small">${c.ag?esc(c.ag):'<span class="muted">sem responsável</span>'}${c.dup?' <span class="tag warn" title="Mesmo telefone ou COD de outra presença do período: não conta na meta">repetido</span>':""}</td>
     <td class="n"><input class="money" id="mv-${esc(l.key)}" inputmode="decimal" data-a="mvalor" data-k="${esc(l.key)}" data-m="${l.mes}" value="${c.valor?String(c.valor).replace(".",","):""}" placeholder="0,00" aria-label="Valor de ${esc(l.contato)}"></td>
     <td><select id="ml-${esc(l.key)}" data-a="mlimp" data-k="${esc(l.key)}" data-m="${l.mes}" aria-label="Foi limpeza?">${opts(["Sim","Não"],c.limpRes,c.eleg?"Verificar":"–")}</select>${c.verificar?' <span class="tag">verificar</span>':""}</td>
     <td class="n"><input class="money" style="width:70px" id="mp-${esc(l.key)}" inputmode="numeric" data-a="mproc" data-k="${esc(l.key)}" data-m="${l.mes}" value="${c.proc||""}" placeholder="0" aria-label="Procedimentos pagos de ${esc(l.contato)}"></td>
     <td class="n">${c.dup?'<span class="muted">–</span>':`<b>${reais(c.total)}</b>`}</td></tr>`).join("")}
   </tbody></table></div><p class="small muted" style="margin:10px 0 0">A presença conta no mês da consulta. A meta vai para quem mudou o lead para Agendado no app; leads da planilha antiga aparecem como "planilha".</p></div>`}
  return h}
function marcarRepetidos(cs){const visto=new Set();for(const [l,c] of cs){const t=tel8(l.contato);const cd=[...codsLead(l)][0];const ks=[t&&"t"+t,cd&&"c"+cd].filter(Boolean);
    if(ks.some(k=>visto.has(k))){c.dup=true;c.total=0;c.verificar=false}ks.forEach(k=>visto.add(k))}return cs}
function textoMetas(K){const [ini,fim,rot]=periodoMetas(K);const cs=marcarRepetidos(presencasPeriodo(ini,fim).sort((a,b)=>(a.agendamento||"").localeCompare(b.agendamento||"")).map(l=>[l,calcMeta(l)])).filter(([,c])=>!c.dup);const por={};
  for(const [l,c] of cs){const k=c.ag||"__sem";(por[k]=por[k]||{pres:0,limp:0,proc:0,total:0});por[k].pres++;if(c.limp)por[k].limp++;por[k].proc+=c.proc;por[k].total+=c.total}
  const f=v=>v.toFixed(2).replace(".",",");let t="Metas "+rot+"\nColaborador\tPresenças\tLimpezas\tProced. pagos\tTotal (R$)\n";
  for(const [id,v] of Object.entries(por))t+=(id==="__sem"?"Sem responsável":id)+"\t"+v.pres+"\t"+v.limp+"\t"+v.proc+"\t"+f(v.total)+"\n";
  const j=cs.filter(([,c])=>c.midia).length;t+="\nJuliana (MKT)\t"+j+" presenças de mídia\t\t\t"+f(j*META.juli)+"\n";return t}

async function baixarBackup(){const leads={};for(const k of MESES)if(isLive(k)&&S.raw&&S.raw[k])leads[k]=S.raw[k];
  const solic=S.solic.map(x=>{const {sid,...d}=x;return {id:sid,data:d}});
  const b={formato:"funil-leads-backup-1",gerado:new Date().toISOString(),historico:S.hist.meses,leads,adm:S.adm,pub:S.pub,risc:Object.fromEntries(Object.entries(S.risc).map(([k,v])=>[k,{itens:v}])),solic,cfg:{acesso:S.cfg},sys:{"migracao-2026-11":{feito:true}},nomes:S.names};
  const n=Object.values(leads).reduce((a,v)=>a+v.length,0);
  await baixar("backup-funil-leads-"+hoje+".json",JSON.stringify(b));toast("Backup com "+NUM.format(n)+" leads ao vivo + histórico.")}

   <p class="small muted" style="margin-top:0">Marque o gestor comercial. A pessoa precisa já ter aberto o app pelo menos uma vez.</p>`;

  if(g.length)h+=`<div class="small" style="margin-top:10px">Com acesso hoje: ${g.map(id=>esc(nome(id))).join(", ")}</div>`;
  h+=`<div class="row" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><button class="btn" data-a="backup">Baixar backup completo (JSON)</button>${window.__restaurar?`<label class="btn" for="rest-file" style="cursor:pointer">Restaurar backup…</label><input type="file" id="rest-file" accept=".json" data-a="restaurar" hidden>`:""}<span class="small muted">Todos os leads, histórico, valores, metas e configurações, para levar ao sistema independente.</span></div>`;
  h+=vChaveRobo();
  return h+`</div>`}
function numBR(s){s=String(s).trim().replace(/[R$\s]/g,"");if(!s)return null;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const v=Number(s);return isFinite(v)&&v>=0?Math.round(v*100)/100:NaN}
async function salvarAdm(k,mut){const ref=S.db.doc("adm/"+k);
  return serial("adm/"+k,async()=>{const novo=JSON.parse(JSON.stringify(S.adm[k]||{}));novo.invest=novo.invest||{};novo.valores=novo.valores||{};novo.metas=novo.metas||{};
    mut(novo);S.adm[k]=novo;await ref.set(novo)})}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
  if(a==="sit"){S.f.sit=t.dataset.v;S.f.res="";S.f.pend=false;S.f.risc=false;S.f.lim=150;render()}
  else if(a==="res"){S.f.res=t.dataset.v;S.f.lim=150;render()}
  else if(a==="pend"){S.f.pend=!S.f.pend;S.f.sit="";S.f.res="";S.f.risc=false;render()}
  else if(a==="irpend"){S.mes=mesAtual;Object.assign(S.f,{res:"",sit:"",pend:true,risc:false})}
  else if(a==="exp"){const b=t;b.disabled=true;const old=b.textContent;b.textContent="Gerando…";exportar(t.dataset.v,S.mes).finally(()=>{b.disabled=false;b.textContent=old})}
  else if(a==="backup"){baixarBackup()}
  else if(a==="limpaf"){Object.assign(S.f,{res:"",sit:"",cidade:"",canal:"",interesse:"",resp:"",busca:"",pend:false,risc:false,dup:false,st:"",eDe:"",eAte:"",cDe:"",cAte:"",lim:150});render()}
  else if(a==="riscf"){S.f.risc=!S.f.risc;S.f.sit="";S.f.pend=false;render()}
  else if(a==="verlead"){S.sel={key:t.dataset.k};renderDrawer()}
  else if(a==="aprovexc"){if(t.dataset.ok){decidirExc(t.dataset.k,true)}else{t.dataset.ok="1";t.textContent="Confirmar exclusão"}}
  else if(a==="recusexc")decidirExc(t.dataset.k,false);
  else if(a==="soverif"){S.soVerif=!S.soVerif;render()}
  else if(a==="copiarmetas"){const txt=textoMetas(S.mes);try{navigator.clipboard.writeText(txt).then(()=>toast("Relatório copiado."),()=>toast("Não consegui copiar. Selecione a tabela e copie manualmente."))}catch(err){toast("Não consegui copiar.")}}
  else if(a==="carregapessoas"){(async()=>{try{const r=await S.user.search("");const arr=Array.isArray(r)?r:((r&&(r.results||r.hits||r.people))||[]);
      S.pessoas=arr.map(p=>({id:p.id,name:p.name||""}));for(const p of S.pessoas)if(p.name)S.names[p.id]=p.name}catch(err){S.pessoas=[]}render()})()}
  else if(a==="gestor"){const id=t.dataset.k;const g=new Set(S.cfg.gestores||[]);g.has(id)?g.delete(id):g.add(id);
    serial("cfg",()=>S.db.doc("cfg/acesso").set({gestores:[...g]})).then(()=>toast("Acesso atualizado."),tratarErro)}
  else if(a==="mais"){S.f.lim+=300;render()}
  else if(a==="abrir"){S.sel={key:t.dataset.k};renderDrawer();const d=document.querySelector("#drawer .stepper button");if(d)d.focus()}
  else if(a==="fechar"){S.sel=null;document.getElementById("drawer-root").innerHTML=""}
  else if(a==="dsit"){S.sel.draft.situacao=t.dataset.v;if(t.dataset.v==="Agendado"&&!S.sel.draft.agPor)S.sel.draft.agPor=meuNome();if(["Presença","Faltoso","Cancelado"].includes(t.dataset.v)&&S.sel.draft.agendamento)S.sel.draft.status=t.dataset.v;renderDrawer()}
  else if(a==="salvar")salvarLead();
  else if(a==="excluir")excluirLead();
  else if(a==="importar")importarNovembro();
  else if(a==="admmodo"){S.adm_mode=t.dataset.v;render()}
  else if(a==="finmodo"){S.fin_mode=t.dataset.v;render()}
  else if(a==="roborun"){rodarRobo()}
  else if(a==="dupf"){S.f.dup=!S.f.dup;S.f.lim=150;render()}
  else if(a==="mflimpar"){S.mf={};render()}
  else if(a==="admtab"){S.admTab=t.dataset.v;render();window.scrollTo(0,0)}
  else if(a==="respaplicar"){aplicarResp()}
  else if(a==="zerar"){zerarMes(t.dataset.m)}
  else if(a==="limpadup"){limparDupImport(t.dataset.m)}
  else if(a==="respcancel"){S.respPrev=null;render()}
  else if(a==="rkhoje"){e.preventDefault();S.rk={p:"hoje"};render()}
  else if(a==="robotok"){const i=document.getElementById("robo-tok");const v=(i&&i.value||"").trim();
    if(!v){toast("Cole a chave antes de salvar.");return}
    S.db.doc("segredo/robo").set({token:v,em:new Date().toISOString(),por:S.me||""}).then(()=>{S.roboTemChave=true;i.value="";toast("Chave salva.");render()}).catch(tratarErro)}
  else if(a==="semvalor"){S.adm_soSemValor=!S.adm_soSemValor;render()}

  if(a==="respfile"){const f=t.files&&t.files[0];t.value="";if(f){S.respMes=null;const sel=document.getElementById("resp-mes");const auto=mesDoArquivo(f.name);S.respMes=auto||(sel&&sel.value)||S.mes;importarResp(f)}return}
  if(a==="rkp"){S.rk={...(S.rk||{}),p:t.value};if(t.value==="custom"){S.rk.de=S.rk.de||mesAtual+"-01";S.rk.ate=S.rk.ate||hoje}render();return}
  if(a==="rkde"||a==="rkate"){S.rk={...(S.rk||{p:"custom"}),[a==="rkde"?"de":"ate"]:t.value};render();return}
  if(a==="restaurar"&&t.files&&t.files[0]&&window.__restaurar){window.__restaurar(t.files[0]);t.value="";return}
  if(a==="mes"){S.mes=t.value;S.f.lim=150;S.ff.resp="";S.f.resp="";assinarMes(S.mes);render()}
  else if(a==="f"&&t.dataset.k!=="busca"){S.f[t.dataset.k]=t.value;S.f.lim=150;render()}
  else if(a==="ff"){S.ff[t.dataset.k]=t.value;render()}
  else if(a==="admtri"){S.adm_tri=+t.value;render()}
  else if(a==="inv"){const v=numBR(t.value);if(Number.isNaN(v)){toast("Valor inválido. Use só números, ex.: 2500,00");return}
    try{await salvarAdm(S.mes,n=>{if(v==null)delete n.invest[t.dataset.k];else n.invest[t.dataset.k]=v});toast("Investimento salvo.")}catch(err){tratarErro(err)}}
  else if(a==="mvalor"||a==="mlimp"||a==="mproc"){const k=t.dataset.k,m=t.dataset.m;let v=null;
    if(a==="mvalor"){v=numBR(t.value);if(Number.isNaN(v)){toast("Valor inválido. Use só números, ex.: 350,00");return}}
    if(a==="mproc"){v=t.value.trim()===""?null:Math.floor(+t.value);if(!(v===null||v>=0)){toast("Use um número inteiro, ex.: 2");return}}
    try{await salvarAdm(m,n=>{if(a==="mvalor"){if(v==null)delete n.valores[k];else n.valores[k]=v}
      else{const mt={...(n.metas[k]||{})};if(a==="mlimp"){if(t.value)mt.limpeza=t.value;else delete mt.limpeza}else{if(v==null)delete mt.proc;else mt.proc=v}
        if(Object.keys(mt).length)n.metas[k]=mt;else delete n.metas[k]}});
      toast("Salvo.");render()}catch(err){tratarErro(err)}}
  else if(a==="valor"){const v=numBR(t.value);if(Number.isNaN(v)){toast("Valor inválido. Use só números, ex.: 3500,00");return}
    try{await salvarAdm(S.mes,n=>{if(v==null)delete n.valores[t.dataset.k];else n.valores[t.dataset.k]=v});toast("Valor salvo.")}catch(err){tratarErro(err)}}
});
/* ---- Botão do robô de presenças (dispara o GitHub Actions) ---- */
const ROBO_REPO="Top-Desenvolvimento/funil-leads-comunicacao",ROBO_WF="conferir-presencas.yml";
const ROBO_UN={caxias:"Caxias",bento:"Bento",farroupilha:"Farroupilha",flores:"Flores",veranopolis:"Veranópolis",encantado:"Encantado",soledade:"Soledade"};
function fmtHora(iso){if(!iso)return "";const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function vRobo(){const r=S.robo||{},est=r.estado||"",simul=S.robo_simular!==false;
  const ocupado=est==="solicitado"||est==="rodando";
  const velho=ocupado&&r.em&&(Date.now()-new Date(r.em).getTime()>30*60*1000);
  let st="";
  if(est==="solicitado"&&!velho)st=`<span class="tag info">Pedido enviado ${esc(fmtHora(r.em))} · o robô começa em até 1 minuto</span>`;
  else if(est==="rodando"&&!velho)st=`<span class="tag info">Conferindo agora… (começou ${esc(fmtHora(r.inicio||r.em))})</span>`;
  else if(velho)st=`<span class="tag warn">O último pedido não terminou. Veja a aba Actions do GitHub.</span>`;
  let tab="";
  if(r.resumo&&(est==="concluido"||est==="erro")){
    const linhas=Object.keys(ROBO_UN).filter(k=>r.resumo[k]).map(k=>{const x=r.resumo[k];
      return `<tr><td>${esc(ROBO_UN[k])}</td>${x.falha?`<td colspan="4" class="small" style="color:var(--bad,#b42318)">Não conferida: ${esc(x.falha)}</td>`:`<td class="n">${x.lidas!=null?NUM.format(x.lidas):"–"}</td><td class="n">${NUM.format(x.pendentes||0)}</td><td class="n"><b>${NUM.format(x.presencas||0)}</b></td><td class="n">${NUM.format(x.pulados||0)}</td>`}</tr>`}).join("");
    tab=`<div class="small muted" style="margin:10px 0 6px">Última conferência: <b>${esc(fmtHora(r.fim))}</b>${r.simular?" · <b>simulação</b> (nada foi gravado)":""}${r.por?" · pedida por "+esc(nome(r.por)):""}</div>
     <div class="tablewrap"><table><thead><tr><th>Unidade</th><th class="n">Avaliações concluídas no sistema</th><th class="n">Agendados sem status</th><th class="n">${r.simular?"Teriam presença":"Presenças gravadas"}</th><th class="n">Pulados</th></tr></thead><tbody>${linhas}</tbody></table></div>`}
  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div><h2 style="margin:0">Conferir presenças no sistema da clínica</h2>
    <div class="small muted">O robô procura as avaliações concluídas nas 7 unidades e marca Presença nos agendados sem status.</div></div>
    <div class="row" style="gap:10px;align-items:center"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-a="robosim"${simul?" checked":""}> Só simular</label>
    <button class="btn pri" data-a="roborun"${ocupado&&!velho?" disabled":""}>${ocupado&&!velho?"Conferindo…":"Rodar conferência"}</button></div></div>
    ${st?`<div style="margin-top:8px">${st}</div>`:""}${tab}</div>`}
async function rodarRobo(){if(!S.isAdm)return;const simular=S.robo_simular!==false;
  let tok="";try{const d=await S.db.doc("segredo/robo").get();tok=(d.exists&&d.data().token)||""}catch(e){}
  if(!tok){toast(S.isOwner?"Cadastre a chave do GitHub no Administrativo (fim da página).":"A chave do GitHub ainda não foi cadastrada. Avise a Nicele.");return}
  const b=document.querySelector('[data-a="roborun"]');if(b)b.disabled=true;
  try{const r=await fetch(`https://api.github.com/repos/${ROBO_REPO}/actions/workflows/${ROBO_WF}/dispatches`,{method:"POST",
      headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok,"X-GitHub-Api-Version":"2022-11-28"},
      body:JSON.stringify({ref:"main",inputs:{simular:simular?"true":"false",unidades:""}})});
    if(r.status!==204){toast(r.status===401?"A chave do GitHub está errada ou venceu.":r.status===404?"O GitHub não achou o robô (confira a chave e o arquivo do workflow).":"O GitHub recusou o pedido ("+r.status+").");if(b)b.disabled=false;return}
    const est={estado:"solicitado",em:new Date().toISOString(),por:S.me||"",simular};
    S.robo={...(S.robo||{}),...est};try{await S.db.doc("robo/estado").set({...(S.robo||{}),...est})}catch(e){}
    toast(simular?"Simulação pedida. O resultado aparece aqui em 1 a 3 minutos.":"Conferência pedida. O resultado aparece aqui em 1 a 3 minutos.");render()}
  catch(e){toast("Não foi possível falar com o GitHub. Confira a internet.");if(b)b.disabled=false}}
function vChaveRobo(){return `<div class="row" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);gap:8px;align-items:flex-end;flex-wrap:wrap">
  <label class="f" for="robo-tok" style="flex:1;min-width:240px">Chave do GitHub para o botão do robô<input id="robo-tok" type="password" autocomplete="off" placeholder="${S.roboTemChave?"Chave cadastrada · cole outra para trocar":"Cole aqui a chave (github_pat_...)"}"></label>
  <button class="btn" data-a="robotok">Salvar chave</button></div>
  <div class="small muted" style="margin-top:4px">Fica guardada no banco e só a gerência consegue ler. Nunca é mostrada na tela.</div>`}

/* ---- Robô de conferência de presenças (usado pelo Claude pelo navegador; só gerência) ---- */
window.__robo={
  pendentes(ate){ate=ate||hoje;if(!S.isAdm)throw new Error("Só a gerência pode usar o robô.");
    const out=[];for(const k of MESES)if(isLive(k))for(const l of ativos(k))
      if(l.situacao==="Agendado"&&!l.status&&l.agendamento&&l.agendamento<=ate)
        out.push({mes:k,id:l.id,cod:l.cod,contato:l.contato,agendamento:l.agendamento,cidade:l.cidade,interesse:l.interesse,agPor:agendadorNome(l)||""});
    return out.sort((a,b)=>a.agendamento<b.agendamento?-1:1)},
  async aplicar(lista){if(!S.isAdm)throw new Error("Só a gerência pode usar o robô.");
    const ok=["Presença","Faltoso","Cancelado"],res={gravados:0,pulados:[]};
    for(const it of lista||[]){
      if(!ok.includes(it.status)){res.pulados.push({id:it.id,motivo:"status inválido"});continue}
      try{const ref=S.db.doc("m/"+it.mes+"/leads/"+it.id);const snap=await ref.get();
        if(!snap.exists){res.pulados.push({id:it.id,motivo:"lead não encontrado"});continue}
        const x=snap.data()||{};
        if(x.status){res.pulados.push({id:it.id,motivo:"já tinha status ("+x.status+")"});continue}
        if(x.situacao!=="Agendado"){res.pulados.push({id:it.id,motivo:"situação mudou ("+x.situacao+")"});continue}
        const t=new Date().toISOString();
        const n={u:S.me||"",t,de:"Agendado",para:"Agendado",st:it.status,txt:"Robô de conferência: conferido no sistema da clínica"+(it.obs?" · "+String(it.obs).slice(0,200):"")};
        await serial(it.mes+"/"+it.id,()=>ref.update({status:it.status,notas:[...(Array.isArray(x.notas)?x.notas:[]),n].slice(-60),atualizado:t,atualizadoPor:S.me||"",conferidoRobo:t}));
        res.gravados++}
      catch(e){res.pulados.push({id:it.id,motivo:"erro "+((e&&e.code)||e)})}}
    toast("Robô: "+res.gravados+" status gravados"+(res.pulados.length?", "+res.pulados.length+" pulados":"")+".");return res}
};

window.__iniciar=()=>{rota();boot();};
</script>
